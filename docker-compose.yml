name: ragforge

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ragforge
      POSTGRES_PASSWORD: ragforge
      POSTGRES_DB: ragforge
    ports:
      - "5433:5432"          # 5433 on the host, so it never clashes with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge -d ragforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
