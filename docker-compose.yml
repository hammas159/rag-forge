name: ragforge

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ragforge
      POSTGRES_PASSWORD: ragforge
      POSTGRES_DB: ragforge
    ports:
      - "5433:5432"          # 5433 on the host, so it never clashes with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge -d ragforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: `docker compose --profile app up` for a clone-and-run demo (CPU models).
  # For GPU, run the API on the host instead: `make api`.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      POSTGRES_DSN: postgresql://ragforge:ragforge@postgres:5432/ragforge
      REDIS_URL: redis://redis:6379/0
      DEVICE: cpu
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - hfcache:/models          # model weights survive rebuilds
      - ./data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  hfcache:
